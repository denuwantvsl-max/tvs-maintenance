<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1726">
<meta name="robots" content="noindex, nofollow">
<title>Generator log – TVS Horana</title>
<link rel="icon" href="img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="viz.css?v=1">
<style>
.ro { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .4px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.12); color: #e2e8f0; }
.period { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 4px; }
.period input[type=month] { width: auto; padding: 7px 10px; font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.verdict { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 14.5px; margin-top: 10px; }
.verdict.good { background: #f0fdf4; color: #14532d; } .verdict.bad { background: #fef2f2; color: #7f1d1d; } .verdict.info { background: #f1f5f9; color: #334155; }
.verdict .ic { font-size: 20px; line-height: 1; }
.hbar { display: grid; grid-template-columns: 170px minmax(0, 1fr) 82px; gap: 10px; align-items: center; margin: 10px 0; font-size: 13.5px; }
.hbar .lab { color: var(--text-secondary); font-weight: 600; }
.hbar .track { height: 18px; background: var(--grid); border-radius: 0 6px 6px 0; display: flex; gap: 2px; }
.hbar .track i { display: block; height: 100%; border-radius: 0 6px 6px 0; }
.hbar .track i.part { border-radius: 0; }
.hbar .val { text-align: right; font-weight: 800; color: var(--text-primary); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .hbar { grid-template-columns: 110px minmax(0, 1fr) 64px; font-size: 12.5px; } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dh { font-size: 11px; color: var(--text-muted); text-align: center; padding-bottom: 2px; }
.cal .d { position: relative; aspect-ratio: 1 / 1; border-radius: 8px; background: var(--grid); display: flex; flex-direction: column; justify-content: space-between; padding: 4px 5px;
  font-size: 11px; color: var(--text-secondary); cursor: default; min-height: 34px; }
.cal .d b { font-size: 12px; color: inherit; }
.cal .d small { font-weight: 700; font-size: 11px; }
.cal .d.nodata { background: repeating-linear-gradient(135deg, #f8fafc 0 4px, #eef0f3 4px 6px); color: var(--text-muted); }
.cal .d.out { visibility: hidden; }
.cal .d.l1 { background: #9ec5f4; color: #0b1220; } .cal .d.l2 { background: #3987e5; color: #fff; } .cal .d.l3 { background: #184f95; color: #fff; }
.cal .d .pc { position: absolute; top: 3px; right: 4px; font-size: 11px; }
.cal-month { font-weight: 700; margin: 12px 0 6px; font-size: 14px; }
.keyrow { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
.keyrow i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
.runs { display: grid; gap: 8px; }
.run { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #f8fafc; font-size: 13.5px; }
.run .when b { display: block; font-size: 14px; }
.run .when span { color: var(--text-muted); font-size: 12px; }
.run .tl { position: relative; height: 10px; background: var(--grid); border-radius: 5px; }
.run .tl i { position: absolute; top: 0; bottom: 0; background: var(--series-1); border-radius: 5px; min-width: 4px; }
.run .meta { color: var(--text-secondary); font-size: 12.5px; margin-top: 4px; }
.run .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #e0ecfb; color: #1c5cab; margin-right: 6px; }
.run .tag.svc { background: #f1f5f9; color: #334155; }
.run .lph { text-align: right; font-weight: 800; white-space: nowrap; }
.run .lph small { display: block; font-weight: 500; color: var(--text-muted); font-size: 11.5px; }
table.log td.ev { text-align: left; }
table.log td.note { text-align: left; white-space: normal; min-width: 180px; color: var(--text-secondary); }
.flagtxt { color: #b91c1c; font-weight: 700; }
@media print {
  .period, .actions, details.tbl summary { display: none !important; }
  details.tbl { display: block; } details.tbl > * { display: block; }
  .panel, .stat { box-shadow: none; break-inside: avoid; }
  body { background: #fff; }
}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <span class="brand">
      <span class="logo"><img src="img/tvs-logo.png" alt="TVS" width="30" height="37"></span>
      <span class="brand-text">
        <span class="mark">Generator<em>LOG</em></span>
        <span class="sub">TVS Lanka · Horana Assembly Plant <span class="ro">VIEW ONLY</span></span>
      </span>
    </span>
  </div>
</header>

<main class="wrap wide viz" id="main">
  <div class="loading"><div class="spinner"></div>Loading…</div>
</main>

<script src="config.js?v=2"></script>
<script src="common.js?v=4"></script>
<script src="viz.js?v=1"></script>
<script src="generator-log.js?v=3"></script>
</body>
</html>
