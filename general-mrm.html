<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1726">
<meta name="robots" content="noindex, nofollow">
<title>General MRM – TVS Horana</title>
<link rel="icon" href="img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="general-mrm.css?v=1">
</head>
<body>
<header class="top no-print">
  <div class="row">
    <a class="brand" href="general-mrm.html">
      <span class="logo"><img src="img/tvs-logo.png" alt="TVS" width="30" height="37"></span>
      <span class="brand-text">
        <span class="mark">General MRM<em>Plant</em></span>
        <span class="sub">Monthly plant management review · TVS Horana</span>
      </span>
    </a>
    <a class="lang-btn" href="app.html">CMMS ↗</a>
  </div>
</header>

<main class="wrap wide no-print" id="page">
  <div class="kpis" id="kpis"></div>

  <div class="gm-grid">
    <div class="gm-main">
      <div class="chips" id="views">
        <button type="button" class="chip on" data-view="meet">📝 Take a meeting</button>
        <button type="button" class="chip" data-view="list">📚 Meetings</button>
        <button type="button" class="chip" data-view="acts">✅ All actions</button>
      </div>
      <div id="msg"></div>
      <section id="v-meet"></section>
      <section id="v-list" class="hidden"></section>
      <section id="v-acts" class="hidden"></section>
    </div>

    <aside class="gm-side">
      <div class="card">
        <div class="gm-side-head"><h3>Pending work</h3><span class="muted small" id="pendCount"></span></div>
        <div id="pending"><div class="loading"><span class="spinner"></span> Loading…</div></div>
      </div>
    </aside>
  </div>
</main>

<div id="print" class="print-only"></div>

<script src="config.js"></script>
<script src="common.js?v=5"></script>
<script src="general-mrm.js?v=1"></script>
</body>
</html>
