<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1726">
<title>Maintenance Team – TVS Horana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body class="has-tabbar">
<header class="top no-print">
  <div class="row">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
      <span class="brand-text">
        <span class="mark"><span data-i18n="appName">Maintenance</span><em>CMMS</em></span>
        <span class="sub" id="whoami">TVS Lanka · Horana Assembly Plant</span>
      </span>
    </a>
    <button class="lang-btn" type="button">සිංහල</button>
  </div>
</header>

<!-- login -->
<main class="wrap hidden" id="loginView">
  <h1 data-i18n="teamTitle">Maintenance team</h1>
  <form id="loginForm" class="card" autocomplete="off">
    <label class="f" for="lgUser" data-i18n="whoAreYou">Who are you?</label>
    <select id="lgUser"></select>
    <label class="f" for="lgPin">PIN</label>
    <input type="password" id="lgPin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password">
    <div id="lgErr" class="hidden"></div>
    <div style="margin-top:16px"><button class="btn dark" type="submit" id="lgBtn" data-i18n="login">Log in</button></div>
  </form>
</main>

<!-- app -->
<div id="appView" class="hidden">
  <nav class="tabs no-print" id="tabs">
    <button data-tab="jobs" class="on"><svg class="i" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg><span data-i18n="tabJobs">Jobs</span></button>
    <button data-tab="pm"><svg class="i" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg><span data-i18n="tabPm">PM</span></button>
    <button data-tab="assets"><svg class="i" viewBox="0 0 24 24"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg><span data-i18n="tabAssets">Machines</span></button>
    <button data-tab="dash"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span data-i18n="tabDash">Dashboard</span></button>
    <button data-tab="me"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span data-i18n="tabMe">Me</span></button>
  </nav>

  <section class="wrap wide" id="tab-jobs">
    <div class="chips no-print" id="jobViews" style="margin-bottom:10px"></div>
    <div class="toolbar">
      <input type="search" id="jobQ" data-i18n-ph="searchJobs">
      <a class="btn sm" href="request.html" data-i18n="newJob">+ New</a>
    </div>
    <div id="jobList" class="list"></div>
  </section>

  <section class="wrap wide hidden" id="tab-pm">
    <div class="chips no-print" id="pmViews" style="margin-bottom:10px"></div>
    <div class="toolbar">
      <input type="search" id="pmQ" data-i18n-ph="searchPm">
      <button class="btn sm mgr" id="pmAdd" type="button" data-i18n="add">+ Add</button>
    </div>
    <div id="pmList" class="list"></div>
  </section>

  <section class="wrap wide hidden" id="tab-assets">
    <div class="toolbar">
      <input type="search" id="assetQ" data-i18n-ph="searchAssets">
      <button class="btn sm ghost" id="assetQr" type="button" data-i18n="qrShort">QR</button>
      <button class="btn sm mgr" id="assetAdd" type="button" data-i18n="add">+ Add</button>
    </div>
    <div class="chips" id="areaChips" style="margin-bottom:10px"></div>
    <div id="assetList" class="list"></div>
  </section>

  <section class="wrap wide hidden" id="tab-dash"></section>

  <section class="wrap wide hidden" id="tab-labels">
    <div class="no-print">
      <p class="lead" data-i18n="labelsLead">Tick the machines, then press Print. Two labels per row on A4 (cut and laminate).</p>
      <div class="toolbar">
        <input type="search" id="lblQ" data-i18n-ph="searchAssets">
        <button class="btn sm ghost" id="lblAll" type="button" data-i18n="selectAll">Select all</button>
      </div>
      <div id="lblPick" class="card" style="max-height:340px;overflow:auto;padding:6px 12px"></div>
      <button class="btn dark" id="lblPrint" type="button" data-i18n="printLabels">Print labels</button>
      <p class="hint" id="lblCount"></p>
    </div>
    <div class="labels" id="lblOut"></div>
  </section>

  <section class="wrap hidden" id="tab-me"></section>
</div>

<!-- full screen detail -->
<div class="sheet hidden" id="sheet">
  <div class="bar"><button class="icon-btn" id="sheetBack" type="button">←</button><b id="sheetTitle"></b></div>
  <div class="wrap" id="sheetBody"></div>
</div>

<script src="config.js?v=2"></script>
<script src="common.js?v=4"></script>
<script src="app.js?v=6"></script>
</body>
</html>
