<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1726">
<title>TVS Horana Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <div class="row">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
      <span class="brand-text">
        <span class="mark"><span data-i18n="appName">Maintenance</span><em>CMMS</em></span>
        <span class="sub" data-i18n="plant">TVS Lanka · Horana Assembly Plant</span>
      </span>
    </a>
    <button class="lang-btn" type="button">සිංහල</button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 data-i18n="homeTitle">How can we help?</h1>
    <p class="lead" data-i18n="homeLead">Report a breakdown, follow a job, or manage maintenance work.</p>
  </div>
  <div class="tiles">
    <a class="tile red" href="request.html">
      <div class="ic"><svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
      <div><b data-i18n="reportTitle">Report a problem</b><span data-i18n="reportSub"></span></div>
      <span class="go"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
    </a>
    <a class="tile" href="track.html">
      <div class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
      <div><b data-i18n="trackTitle">Check my request</b><span data-i18n="trackSub"></span></div>
      <span class="go"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
    </a>
    <a class="tile dark" href="app.html">
      <div class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><b data-i18n="teamTitle">Maintenance team</b><span data-i18n="teamSub"></span></div>
      <span class="go"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
    </a>
  </div>
  <div class="msg info notice"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span data-i18n="scanHint"></span></div>
</main>
<footer class="doc">TVS Lanka (Pvt.) Ltd · Vehicle Assembly Complex – Horana</footer>

<script src="config.js?v=2"></script>
<script src="common.js?v=2"></script>
<script>CMMS.initLangButton();</script>
</body>
</html>
