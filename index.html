<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2126">
<title>TVS Horana Maintenance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="band"></div>
<header class="top">
  <div class="row">
    <a class="brand" href="./">
      <div class="mark">TVS · <span data-i18n="appName">Maintenance</span></div>
      <div class="sub" data-i18n="plant">TVS Lanka · Horana Assembly Plant</div>
    </a>
    <button class="lang-btn" type="button">සිංහල</button>
  </div>
</header>

<main class="wrap">
  <div class="tiles">
    <a class="tile red" href="request.html">
      <div class="ic">🛠️</div>
      <div><b data-i18n="reportTitle">Report a problem</b><span data-i18n="reportSub"></span></div>
    </a>
    <a class="tile" href="track.html">
      <div class="ic">🔎</div>
      <div><b data-i18n="trackTitle">Check my request</b><span data-i18n="trackSub"></span></div>
    </a>
    <a class="tile dark" href="app.html">
      <div class="ic">👷</div>
      <div><b data-i18n="teamTitle">Maintenance team</b><span data-i18n="teamSub"></span></div>
    </a>
  </div>
  <div class="msg info" data-i18n="scanHint"></div>
</main>
<footer class="doc">TVS Lanka (Pvt.) Ltd · Vehicle Assembly Complex – Horana</footer>

<script src="config.js"></script>
<script src="common.js"></script>
<script>CMMS.initLangButton();</script>

</html>
