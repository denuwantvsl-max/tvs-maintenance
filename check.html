<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1726">
<meta name="robots" content="noindex, nofollow">
<title>Daily check – TVS Horana</title>
<link rel="icon" href="img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<style>
.mach { display: flex; gap: 12px; align-items: center; }
.mach img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; background: #f1f5f9; }
.mach .id { font-size: 22px; font-weight: 800; letter-spacing: .4px; }
.mach .nm { font-weight: 600; }
.who { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
.who b { font-size: 17px; }
.linkbtn { background: none; border: 0; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; padding: 4px 0; text-decoration: underline; }
.op-row { padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
.op-row .q { font-size: 16px; line-height: 1.4; }
.op-row .q .en { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.op-row .sf { display: inline-block; font-size: 11px; font-weight: 700; color: #b91c1c; background: #fef2f2; border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.op-btns { display: grid; grid-template-columns: 1fr 1fr 64px; gap: 8px; margin-top: 8px; }
.op-btns button { border: 2px solid var(--line-2); background: #fff; border-radius: 12px; padding: 11px 6px; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.op-btns button.na { font-size: 13px; color: var(--muted); }
.op-btns button.on.ok { background: var(--green); border-color: var(--green); color: #fff; }
.op-btns button.on.nok { background: var(--red); border-color: var(--red); color: #fff; }
.op-btns button.on.na { background: #64748b; border-color: #64748b; color: #fff; }
.op-row.bad { background: #fff7f7; margin: 0 -16px; padding: 12px 16px; }
.op-row.miss .q { color: #b91c1c; }
.op-note { margin-top: 8px; }
.stop { background: #b91c1c; color: #fff; border-radius: 12px; padding: 12px 14px; margin-top: 8px; font-weight: 700; font-size: 15px; }
.prog { position: sticky; top: 0; z-index: 3; background: var(--navy); color: #e2e8f0; border-radius: 0 0 12px 12px; padding: 8px 14px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; }
.donebox { text-align: center; padding: 22px 16px; }
.donebox .big { font-size: 54px; line-height: 1; }
.today-list { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
@media (max-width: 360px) { .op-btns { grid-template-columns: 1fr 1fr 54px; } .op-btns button { font-size: 15px; padding: 10px 4px; } }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <span class="brand">
      <span class="logo"><img src="img/tvs-logo.png" alt="TVS" width="30" height="37"></span>
      <span class="brand-text">
        <span class="mark">Daily<em>CHECK</em></span>
        <span class="sub" data-i18n="plant">TVS Lanka · Horana Assembly Plant</span>
      </span>
    </span>
    <button class="lang-btn" type="button">English</button>
  </div>
</header>

<main class="wrap" id="out"><div class="loading"><div class="spinner"></div>Loading…</div></main>

<script src="config.js?v=2"></script>
<script src="common.js?v=4"></script>
<script src="check.js?v=1"></script>
</body>
</html>
